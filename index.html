<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>父ASIN粒度广告分析看板 V6.6</title>
    <style>
        :root { 
            --bg-color: #F8F9FA; 
            --card-bg: #FFFFFF; 
            --text-main: #111115; 
            --text-muted: #6E6E73; 
            --accent: #0066CC; 
            --accent-hover: #0055B3;
            --border-color: rgba(0, 0, 0, 0.06); 
            --radius: 20px; 
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.06);
            --font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --green: #34C759;
            --red: #FF3B30;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); margin: 0; padding: 40px 20px; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        .container { max-width: 1440px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .title { font-size: 34px; font-weight: 700; letter-spacing: -0.015em; color: var(--text-main); }
        
        .upload-area { border: 1px dashed #C7C7CC; padding: 40px 30px; text-align: center; background: var(--card-bg); border-radius: var(--radius); cursor: pointer; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); margin-bottom: 30px; box-shadow: var(--shadow-subtle); }
        .upload-area:hover { border-color: var(--accent); background: #FBFBFD; transform: scale(1.002); box-shadow: var(--shadow-hover); }
        .upload-area h3 { font-size: 20px; font-weight: 600; margin-bottom: 0; color: var(--text-main); }
        .hidden-input { display: none; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 30px; display: none; }
        .kpi-card { background: var(--card-bg); padding: 12px 16px; border-radius: 16px; box-shadow: var(--shadow-subtle); text-align: center; position: relative; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; min-height: 100px; cursor: pointer; }
        .kpi-card:hover { border-color: rgba(0, 102, 204, 0.3); transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        .kpi-value { font-size: 32px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
        .kpi-trend { font-size: 12px; font-weight: 600; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
        
        .trend-up-bad { color: var(--red); }
        .trend-down-good { color: var(--green); }
        .trend-up-good { color: var(--green); }
        .trend-down-bad { color: var(--red); }
        .trend-neutral { color: var(--text-muted); }
        
        .charts-grid { display: grid; gap: 24px; margin-bottom: 24px; display: none; }
        .top-grid { grid-template-columns: 1.2fr 1.8fr; height: 320px; }
        .full-grid { grid-template-columns: 1fr; height: 400px; margin-bottom: 24px; }
        .chart-container { background: var(--card-bg); padding: 20px 24px; border-radius: var(--radius); box-shadow: var(--shadow-subtle); border: 1px solid var(--border-color); display: flex; flex-direction: column; box-sizing: border-box; height: 100%; transition: all 0.3s; }
        .chart-container:hover { border-color: rgba(0, 102, 204, 0.3); box-shadow: var(--shadow-hover); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; flex-shrink: 0; position: relative; z-index: 10; }
        .chart-wrapper { position: relative; flex: 1; min-height: 0; width: 100%; }
        .absolute-chart { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .actions { text-align: right; display: none; margin-bottom: 30px; }
        .btn-export { background-color: var(--accent); color: white; border: none; padding: 10px 24px; font-size: 14px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; letter-spacing: 0.01em; box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3); }
        .btn-export:hover { background-color: var(--accent-hover); transform: scale(1.02); box-shadow: 0 6px 16px rgba(0, 102, 204, 0.4); }
        .btn-export:active { transform: scale(0.98); }
        
        #loading { display: none; color: var(--accent); font-weight: 600; text-align: center; margin: 40px 0; font-size: 16px; letter-spacing: 0.02em; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: opacity 0.3s; }
        .modal-content { background-color: var(--card-bg); margin: 2% auto; padding: 0; border-radius: 24px; width: 96%; max-width: 1540px; height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); }
        .modal-header { padding: 24px 36px; border-bottom: 1px solid #E5E5EA; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.92); z-index: 10; }
        .modal-title-group { display: flex; align-items: center; gap: 24px; }
        .modal-title { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
        
        .filter-select {  border: 1px solid #E5E5EA; border-radius: 14px; padding: 10px 36px 10px 16px; font-size: 14px; outline: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); font-family: var(--font-family); background: #F5F5F7; color: var(--text-main); font-weight: 600; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2210%22%20viewBox%3D%220%200%2014%2010%22%3E%3Cpath%20fill%3D%22%2386868B%22%20d%3D%22M7%2010L0%203l1.4-1.4L7%207.2l5.6-5.6L14%203z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 14px center; background-size: 10px auto; cursor: pointer; }
        .filter-select:focus { border-color: var(--accent); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(0,102,204,0.15); }
        .filter-select:hover { border-color: #D1D1D6; }
        
        .search-box { position: relative;  }
        .search-input { border: 1px solid #E5E5EA; border-radius: 14px; padding: 10px 16px 10px 38px; font-size: 14px; outline: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); width: 280px; font-family: var(--font-family); background: #F5F5F7; color: var(--text-main); font-weight: 500; }
        .search-input:focus { border-color: var(--accent); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(0,102,204,0.15); width: 340px; }
        .search-input::placeholder { color: #A1A1A6; font-weight: 400; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #A1A1A6; font-size: 14px; }
        .clear-search { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #A1A1A6; font-size: 18px; cursor: pointer; display: none; line-height: 1; }
        .clear-search:hover { color: var(--text-main); }
        
        .close-btn { color: #A1A1A6; font-size: 32px; font-weight: 300; cursor: pointer; line-height: 1; padding: 0 8px; border-radius: 50%; transition: all 0.2s;  }
        .close-btn:hover { color: var(--text-main); background: #F2F2F7; }
        
        .table-wrapper { flex: 1; overflow-y: auto; overflow-x: auto; padding: 0 10px; background: #FFFFFF;  }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; margin: 0; }
        .data-table th, .data-table td { padding: 16px 14px; text-align: center; border-bottom: 1px solid #F2F2F7; white-space: nowrap; vertical-align: middle; transition: background 0.2s; } 
        .data-table th { color: var(--text-muted); font-weight: 600; font-size: 13px; position: sticky; top: 0; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 5; box-shadow: 0 1px 0 #E5E5EA; letter-spacing: 0.02em; }
        .data-table tr:hover td { background-color: #F9FAFB; }
        
        .wrap-cell { white-space: normal !important; min-width: 240px; text-align: left !important; line-height: 1.6; color: #444; }
        
        .merged-cell { background-color: #FAFAFC; border-right: 1px solid #F2F2F7; }
        .daily-cell { font-size: 13px; color: #86868B; font-variant-numeric: tabular-nums; }
        
        .priority-cell { white-space: nowrap; }
        .tag { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; display: inline-block; letter-spacing: 0.02em; border: 1px solid transparent; }
        /* 色彩分级更新 */
        .tag-p0 { background-color: #FFECEB; color: #FF3B30; border-color: #FFD1CF; }
        .tag-p1 { background-color: #FFF4E5; color: #FF9500; border-color: #FFE0B2; }
        .tag-p2 { background-color: #E5F1FF; color: #007AFF; border-color: #B2D7FF; }
        .tag-p3 { background-color: #EBF9EE; color: #34C759; border-color: #C3EBCF; }
        .tag-p4 { background-color: #F2F2F7; color: #8E8E93; border-color: #E5E5EA; }
        
        .sub-metric { font-size:11px; color:var(--text-muted); margin-top:6px; white-space:nowrap; line-height:1.5; font-weight: 500; font-variant-numeric: tabular-nums; }
        
        .back-btn { background: #F2F2F7; border: none; padding: 6px 16px; border-radius: 14px; cursor: pointer; font-size: 13px; color: var(--text-main); font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; }
        .back-btn:hover { background: #E5E5EA; }

        .img-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: opacity 0.3s; align-items: center; justify-content: center; }
        .img-modal-content { max-width: 90%; max-height: 90%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); object-fit: contain; }
        .img-close-btn { position: absolute; top: 30px; right: 40px; color: #FFFFFF; font-size: 40px; font-weight: 300; cursor: pointer; transition: all 0.2s; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .img-close-btn:hover { color: #E5E5EA; transform: scale(1.1); }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>if(typeof XLSX === 'undefined') document.write('<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script>if(typeof ExcelJS === 'undefined') document.write('<script src="https://unpkg.com/exceljs@4.3.0/dist/exceljs.min.js"><\/script>');</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>if(typeof saveAs === 'undefined') document.write('<script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"><\/script>');</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script>if(typeof echarts === 'undefined') document.write('<script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"><\/script>');</script>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">父ASIN粒度广告分析看板</div>
    </div>

    <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h3>导入《广告数据报表》</h3>
        <input type="file" id="file-input" class="hidden-input" accept=".xlsx, .xls">
    </div>

    <div id="loading">正在提取特征矩阵... (请保持页面打开)</div>

    <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card" onclick="openModal('ALL')">
            <div class="kpi-label">有效诊断 ASIN</div>
            <div class="kpi-value" id="kpi-asins">0</div>
        </div>
        <div class="kpi-card" onclick="openModal('P0')">
            <div class="kpi-label" style="color: var(--red);">P0级 紧急止损款</div>
            <div class="kpi-value" id="kpi-p0" style="color: var(--red);">0</div>
        </div>
        <div class="kpi-card" onclick="openModal('ALL')">
            <div class="kpi-label">近一周自然单占比</div>
            <div class="kpi-value" id="kpi-organic-ratio">0%</div>
            <div class="kpi-trend" id="trend-organic"></div>
        </div>
        <div class="kpi-card" onclick="openModal('ALL')">
            <div class="kpi-label">本组单件成本 (CPS)</div>
            <div class="kpi-value" id="kpi-cps">$0.00</div>
            <div class="kpi-trend" id="trend-cps"></div>
        </div>
        <div class="kpi-card" onclick="openModal('ALL')">
            <div class="kpi-label">综合 TACOS</div>
            <div class="kpi-value" id="kpi-tacos">0%</div>
            <div class="kpi-trend" id="trend-tacos"></div>
        </div>
    </div>

    <div class="actions" id="actions">
        <button class="btn-export" style="background-color: #6E6E73; margin-right: 12px;" onclick="document.getElementById('file-input').click()">本地手动上传</button>
        <button class="btn-export" onclick="exportToExcelV6_6()">导出精研分析报告 (Excel)</button>
    </div>

    <div class="charts-grid top-grid" id="charts-grid-1">
        <div class="chart-container">
            <div class="chart-wrapper"><div id="chart-priority" class="absolute-chart"></div></div>
        </div>
        <div class="chart-container">
            <div class="chart-wrapper"><div id="chart-owner" class="absolute-chart"></div></div>
        </div>
    </div>
    
    <div class="charts-grid full-grid" id="charts-grid-sales">
        <div class="chart-container">
            <div class="chart-header">
                <div><span style="font-weight: 700; font-size: 16px; color: var(--text-main);">日均销量骤降 TOP 10</span></div>
                <div><select id="ownerFilterSales" class="filter-select" style="padding: 6px 28px 6px 12px; font-size: 12px;" onchange="updateSalesChart()"><option value="ALL">全员</option></select></div>
            </div>
            <div class="chart-wrapper"><div id="chart-sales" class="absolute-chart"></div></div>
        </div>
    </div>
    
    <div class="charts-grid full-grid" id="charts-grid-cps">
        <div class="chart-container">
            <div class="chart-header">
                <div><span style="font-weight: 700; font-size: 16px; color: var(--text-main);">成本恶化 TOP 10 (单均获客成本抬升)</span></div>
                <div><select id="ownerFilterCps" class="filter-select" style="padding: 6px 28px 6px 12px; font-size: 12px;" onchange="updateCpsChart()"><option value="ALL">全员</option></select></div>
            </div>
            <div class="chart-wrapper"><div id="chart-cps" class="absolute-chart"></div></div>
        </div>
    </div>

    <div class="charts-grid full-grid" id="charts-grid-ctr">
        <div class="chart-container">
            <div class="chart-header">
                <div><span style="font-weight: 700; font-size: 16px; color: var(--text-main);">点击率 (CTR) 骤降 TOP 10</span></div>
                <div><select id="ownerFilterCtr" class="filter-select" style="padding: 6px 28px 6px 12px; font-size: 12px;" onchange="updateCtrChart()"><option value="ALL">全员</option></select></div>
            </div>
            <div class="chart-wrapper"><div id="chart-ctr" class="absolute-chart"></div></div>
        </div>
    </div>

    <div class="charts-grid full-grid" id="charts-grid-cvr">
        <div class="chart-container">
            <div class="chart-header">
                <div><span style="font-weight: 700; font-size: 16px; color: var(--text-main);">转化率 (CVR) 骤降 TOP 10</span></div>
                <div><select id="ownerFilterCvr" class="filter-select" style="padding: 6px 28px 6px 12px; font-size: 12px;" onchange="updateCvrChart()"><option value="ALL">全员</option></select></div>
            </div>
            <div class="chart-wrapper"><div id="chart-cvr" class="absolute-chart"></div></div>
        </div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title-group">
                <h2 id="modal-title" class="modal-title">深度洞察中心</h2>
                <select id="priorityFilter" class="filter-select" onchange="changePriorityFilter()">
                    <option value="ALL">全部分级过滤</option>
                    <option value="P0">P0 级 (紧急止损)</option>
                    <option value="P1">P1 级 (降本增效/乘胜追击)</option>
                    <option value="P2">P2 级 (预算调控/尝试扩量)</option>
                    <option value="P3">P3 级 (观察防守)</option>
                    <option value="P4">P4 级 (维持现状)</option>
                </select>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="输入 ASIN/货号/负责人触发下钻..." onkeyup="debounceSearch()">
                    <span class="clear-search" id="clearSearch" onclick="drillDown('')">&times;</span>
                </div>
            </div>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="table-wrapper" id="modal-table-container"></div>
    </div>
</div>

<div id="imgModal" class="img-modal" onclick="closeImgModal()">
    <span class="img-close-btn" onclick="closeImgModal()">&times;</span>
    <img class="img-modal-content" id="fullImage" onclick="event.stopPropagation()">
</div>

<script>
    let globalProcessedData = [];
    let globalOriginalColumns = [];
    let analyticalResults = []; 
    let currentModalType = 'ALL';

    function openImgModal(src, event) {
        if(event) event.stopPropagation(); 
        document.getElementById('fullImage').src = src;
        document.getElementById('imgModal').style.display = "flex";
    }

    function closeImgModal() {
        document.getElementById('imgModal').style.display = "none";
        document.getElementById('fullImage').src = "";
    }
    window.openImgModal = openImgModal;
    window.closeImgModal = closeImgModal;

    let searchTimeout;
    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(renderModalTable, 250);
    }
    window.debounceSearch = debounceSearch;

    function parseNumber(val) {
        if (val === undefined || val === null) return 0;
        if (typeof val === 'string') {
            return parseFloat(val.replace(/,/g, '')) || 0;
        }
        return Number(val) || 0;
    }
    
    function parseMetric(val) {
        if (val === undefined || val === null) return 0;
        if (typeof val === 'string') {
            const cleaned = val.trim().replace(/,/g, '');
            if (cleaned.endsWith('%')) return parseFloat(cleaned.replace('%', '')) / 100;
            return parseFloat(cleaned) || 0;
        }
        return Number(val) || 0;
    }
    
    function getColRaw(row, names) {
        const keys = Object.keys(row);
        for (let n of names) {
            const foundKey = keys.find(k => k.toLowerCase().includes(n.toLowerCase()));
            if (foundKey && row[foundKey] !== undefined && row[foundKey] !== '') return row[foundKey];
        }
        return '';
    }

    const fileInput = document.getElementById('file-input');
    fileInput.addEventListener('change', handleFile);

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        if(typeof XLSX === 'undefined') {
            alert('严重错误：网页底层核心库未加载，请检查网络是否拦截了外网 JS 文件！');
            e.target.value = '';
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.querySelector('.upload-area').style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});
                
                if(jsonData.length > 0) {
                    globalOriginalColumns = Object.keys(jsonData[0]);
                } else {
                    throw new Error("表格为空或格式无法识别。");
                }
                
                processData(jsonData);
                
            } catch (err) {
                alert("导入终止，错误原因：" + err.message);
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.upload-area').style.display = 'block';
            } finally {
                fileInput.value = '';
            }
        };
        reader.onerror = function() {
            alert('文件读取在浏览器层面被阻断，请确保文件没有被本地 Excel/WPS 锁死占用。');
            fileInput.value = '';
            document.getElementById('loading').style.display = 'none';
            document.querySelector('.upload-area').style.display = 'block';
        };
        reader.readAsArrayBuffer(file);
    }

    function processData(data) {
        const grouped = {};
        let totalW2Sales = 0, totalW2AdSales = 0, totalW2Spend = 0, totalW2Revenue = 0;
        let totalW1Sales = 0, totalW1AdSales = 0, totalW1Spend = 0, totalW1Revenue = 0;
        let maxDate = '';

        data.forEach(row => {
            const rowDateStr = String(row['广告日期']).trim();
            const asinStr = String(row['父asin']).trim();
            
            if (!rowDateStr || rowDateStr === '总计' || rowDateStr.includes('广告') || 
                !asinStr || asinStr === '父asin' || asinStr === 'undefined') {
                return;
            }

            if (/\d/.test(rowDateStr)) {
                if (maxDate === '' || rowDateStr > maxDate) {
                    maxDate = rowDateStr;
                }
            }
            
            if (!grouped[asinStr]) grouped[asinStr] = [];
            grouped[asinStr].push(row);
        });

        if (maxDate === '') {
            throw new Error("无法在【广告日期】列提取到有效日期。请检查表格内是否存在奇怪的占位符。");
        }

        analyticalResults = [];
        let p0Count = 0;
        let priorityCounts = {'P0 - 紧急止损': 0, 'P1 - 乘胜追击': 0, 'P1 - 降本增效': 0, 'P2 - 尝试扩量': 0, 'P2 - 预算调控': 0, 'P3 - 观察防守': 0, 'P4 - 维持现状': 0};
        
        for (const asin in grouped) {
            let group = grouped[asin];
            group.sort((a, b) => String(a['广告日期']).localeCompare(String(b['广告日期'])));
            
            if (String(group[group.length - 1]['广告日期']).trim() !== maxDate) continue;

            const week2Data = group.slice(-7);
            const week1Data = group.slice(0, -7).slice(-7); 

            let w2_sales = 0, w2_spend = 0, w2_ad_sales = 0, w2_revenue = 0, w2_ctr_sum = 0, w2_cvr_sum = 0;
            let w2_clicks = 0, w2_impressions = 0;
            week2Data.forEach(r => {
                w2_sales += parseNumber(r['总销量']);
                w2_spend += parseNumber(r['广告花费']);
                w2_ad_sales += parseNumber(r['广告销售量']);
                w2_revenue += parseNumber(getColRaw(r, ['总销售额', '销售额']));
                w2_clicks += parseNumber(getColRaw(r, ['点击', 'click']));
                w2_impressions += parseNumber(getColRaw(r, ['曝光', '展现', 'impression']));
                
                let r_ctr = parseMetric(getColRaw(r, ['CTR', '点击率']));
                if(r_ctr > 1) r_ctr = r_ctr / 100;
                w2_ctr_sum += r_ctr;
                
                let r_cvr = parseMetric(getColRaw(r, ['CVR', '转化率', '7天总订单转化率']));
                if(r_cvr > 1) r_cvr = r_cvr / 100;
                w2_cvr_sum += r_cvr;
            });
            totalW2Sales += w2_sales;
            totalW2AdSales += w2_ad_sales;
            totalW2Spend += w2_spend;
            totalW2Revenue += w2_revenue;

            let w1_sales = 0, w1_spend = 0, w1_ad_sales = 0, w1_revenue = 0, w1_ctr_sum = 0, w1_cvr_sum = 0;
            let w1_clicks = 0, w1_impressions = 0;
            week1Data.forEach(r => {
                w1_sales += parseNumber(r['总销量']);
                w1_spend += parseNumber(r['广告花费']);
                w1_ad_sales += parseNumber(r['广告销售量']);
                w1_revenue += parseNumber(getColRaw(r, ['总销售额', '销售额']));
                w1_clicks += parseNumber(getColRaw(r, ['点击', 'click']));
                w1_impressions += parseNumber(getColRaw(r, ['曝光', '展现', 'impression']));
                
                let r_ctr = parseMetric(getColRaw(r, ['CTR', '点击率']));
                if(r_ctr > 1) r_ctr = r_ctr / 100;
                w1_ctr_sum += r_ctr;
                
                let r_cvr = parseMetric(getColRaw(r, ['CVR', '转化率', '7天总订单转化率']));
                if(r_cvr > 1) r_cvr = r_cvr / 100;
                w1_cvr_sum += r_cvr;
            });

            totalW1Sales += w1_sales;
            totalW1AdSales += w1_ad_sales;
            totalW1Spend += w1_spend;
            totalW1Revenue += w1_revenue;

            const w2_sales_avg = w2_sales / (week2Data.length || 1);
            const w1_sales_avg = w1_sales / (week1Data.length || 1);
            const sales_avg_diff = w2_sales_avg - w1_sales_avg;
            const sales_rate = w1_sales_avg > 0 ? sales_avg_diff / w1_sales_avg : (w2_sales_avg > 0 ? 1 : 0);
            
            const w2_ad_ratio = w2_sales > 0 ? w2_ad_sales / w2_sales : 0;
            const w1_ad_ratio = w1_sales > 0 ? w1_ad_sales / w1_sales : 0;
            const ad_ratio_diff = w2_ad_ratio - w1_ad_ratio;
            const ad_ratio_rate = w1_ad_ratio > 0 ? ad_ratio_diff / w1_ad_ratio : (w2_ad_ratio > 0 ? 1 : 0);

            const w2_spend_avg = w2_spend / (week2Data.length || 1);
            const w1_spend_avg = w1_spend / (week1Data.length || 1);
            const spend_avg_diff = w2_spend_avg - w1_spend_avg;
            const spend_rate = w1_spend_avg > 0 ? spend_avg_diff / w1_spend_avg : (w2_spend_avg > 0 ? 1 : 0);

            const w2_tacos = w2_revenue > 0 ? w2_spend / w2_revenue : 0;
            const w1_tacos = w1_revenue > 0 ? w1_spend / w1_revenue : 0;
            const tacos_diff = w2_tacos - w1_tacos;
            const tacos_rate = w1_tacos > 0 ? tacos_diff / w1_tacos : (w2_tacos > 0 ? 1 : 0);

            const w2_cps = w2_sales > 0 ? w2_spend / w2_sales : 0;
            const w1_cps = w1_sales > 0 ? w1_spend / w1_sales : 0;
            const cps_diff = w2_cps - w1_cps;
            const cps_rate = w1_cps > 0 ? cps_diff / w1_cps : (w2_cps > 0 ? 1 : 0);
            
            const w2_organic_ratio = w2_sales > 0 ? (1 - (w2_ad_sales / w2_sales)) : 0;
            const organic_status = w2_organic_ratio >= 0.6 ? "自然流量健康" : "高度依赖广告";

            let sales_status = sales_rate > 0.05 ? "近期销量攀升" : (sales_rate < -0.05 ? "近期销量下滑" : "近期销量平稳");
            let cost_status = (cps_diff > 1.0 || spend_avg_diff > w1_spend_avg * 0.15) ? "获客成本抬升" : ((cps_diff < -1.0 || spend_avg_diff < -w1_spend_avg * 0.15) ? "获客成本优化" : "成本可控");

            let action = "", priority = "";
            if (sales_status.includes("攀升") && cost_status.includes("优化")) {
                action = "建议稳步放量(抢占核心词坑位)"; priority = "P1 - 乘胜追击";
            } else if (sales_status.includes("攀升") && cost_status.includes("抬升")) {
                action = w2_organic_ratio < 0.6 ? "防守自然位(降出价，剥离泛流量)" : "建议局部优化(微调泛流量)"; priority = "P1 - 降本增效";
            } else if (sales_status.includes("下滑") && cost_status.includes("抬升")) {
                action = "排查差评/断码，缩减无效预算"; priority = "P0 - 紧急止损"; p0Count++;
            } else if (sales_status.includes("下滑") && cost_status.includes("优化")) {
                action = "观望防守(确认自然排位是否被挤占)"; priority = "P3 - 观察防守";
            } else if (sales_status.includes("平稳") && cost_status.includes("抬升")) {
                action = "控制预算(排查恶意点击或同行提价)"; priority = "P2 - 预算调控";
            } else if (sales_status.includes("攀升")) {
                action = "适度放量(尝试拓宽长尾词)"; priority = "P2 - 尝试扩量";
            } else {
                action = "维持现状，定期复盘"; priority = "P4 - 维持现状";
            }
            if(priorityCounts[priority] !== undefined) priorityCounts[priority]++;

            const lastRow = week2Data[week2Data.length - 1];
            const resultRow = { ...lastRow };
            
            resultRow['主图'] = getColRaw(lastRow, ['主图', '图片', '商品图片', 'image', 'img', '主图链接']);
            
            resultRow['上周日均销量'] = Number(w1_sales_avg.toFixed(2));
            resultRow['近一周日均销量'] = Number(w2_sales_avg.toFixed(2));
            resultRow['日均销量差额'] = Number(sales_avg_diff.toFixed(2));
            resultRow['销量环比'] = Number(sales_rate.toFixed(4));
            
            resultRow['上周广告占比'] = Number(w1_ad_ratio.toFixed(4));
            resultRow['近一周广告占比'] = Number(w2_ad_ratio.toFixed(4));
            resultRow['广告占比差额'] = Number(ad_ratio_diff.toFixed(4));
            resultRow['广告占比环比'] = Number(ad_ratio_rate.toFixed(4));

            resultRow['上周日均花费'] = Number(w1_spend_avg.toFixed(2));
            resultRow['近一周日均花费'] = Number(w2_spend_avg.toFixed(2));
            resultRow['日均花费差额'] = Number(spend_avg_diff.toFixed(2));
            resultRow['花费环比'] = Number(spend_rate.toFixed(4));
            
            resultRow['上周TACOS'] = Number(w1_tacos.toFixed(4));
            resultRow['近一周TACOS'] = Number(w2_tacos.toFixed(4));
            resultRow['TACOS差额'] = Number(tacos_diff.toFixed(4));
            resultRow['TACOS环比'] = Number(tacos_rate.toFixed(4));

            resultRow['上周CPS'] = Number(w1_cps.toFixed(2));
            resultRow['近一周CPS'] = Number(w2_cps.toFixed(2));
            resultRow['CPS差额'] = Number(cps_diff.toFixed(2));
            resultRow['CPS环比'] = Number(cps_rate.toFixed(4));

            resultRow['优化调整优先级'] = priority;
            
            const w2_ctr_avg = w2_impressions > 0 ? w2_clicks / w2_impressions : (week2Data.length ? w2_ctr_sum / week2Data.length : 0);
            const w1_ctr_avg = w1_impressions > 0 ? w1_clicks / w1_impressions : (week1Data.length ? w1_ctr_sum / week1Data.length : 0);
            const ctr_diff = w2_ctr_avg - w1_ctr_avg;
            const ctr_rate = w1_ctr_avg > 0 ? ctr_diff / w1_ctr_avg : 0;
            
            const w2_cvr_avg = w2_clicks > 0 ? w2_ad_sales / w2_clicks : (week2Data.length ? w2_cvr_sum / week2Data.length : 0);
            const w1_cvr_avg = w1_clicks > 0 ? w1_ad_sales / w1_clicks : (week1Data.length ? w1_cvr_sum / week1Data.length : 0);
            const cvr_diff = w2_cvr_avg - w1_cvr_avg;
            const cvr_rate = w1_cvr_avg > 0 ? cvr_diff / w1_cvr_avg : 0;

            function getSignStr(val) { return val > 0 ? '+' : (val < 0 ? '-' : ''); }
            let signSales = getSignStr(sales_avg_diff);
            let signCps = getSignStr(cps_diff);
            let signTacos = getSignStr(tacos_diff);
            let signCtr = getSignStr(ctr_diff);
            let signCvr = getSignStr(cvr_diff);
            
            let dataStr = `【波动】近一周销 ${w2_sales_avg.toFixed(1)} (${signSales}${Math.abs(sales_avg_diff).toFixed(1)}) | CPS $${w2_cps.toFixed(2)} (${signCps}$${Math.abs(cps_diff).toFixed(2)}) | TACOS ${(w2_tacos*100).toFixed(1)}% (${signTacos}${(Math.abs(tacos_diff)*100).toFixed(1)}%) | CTR ${(w2_ctr_avg*100).toFixed(1)}% (${signCtr}${(Math.abs(ctr_diff)*100).toFixed(1)}%) | CVR ${(w2_cvr_avg*100).toFixed(1)}% (${signCvr}${(Math.abs(cvr_diff)*100).toFixed(1)}%)`;
            
            resultRow['诊断结论'] = `【特征】${sales_status} | ${cost_status} | ${organic_status}\n【建议】${action}`;
            resultRow['导出诊断结论'] = `${dataStr}\n${resultRow['诊断结论']}`;
            
            resultRow['上周CTR'] = w1_ctr_avg;
            resultRow['近一周CTR'] = w2_ctr_avg;
            resultRow['CTR差额'] = ctr_diff;
            resultRow['CTR环比'] = ctr_rate;
            
            resultRow['上周CVR'] = w1_cvr_avg;
            resultRow['近一周CVR'] = w2_cvr_avg;
            resultRow['CVR差额'] = cvr_diff;
            resultRow['CVR环比'] = cvr_rate;

            resultRow['_week2_details'] = week2Data;
            analyticalResults.push(resultRow);
        }

        if (analyticalResults.length === 0) {
            throw new Error("处理成功，但未识别到在最后一天有流水的 ASIN。");
        }

        analyticalResults.sort((a, b) => b['近一周日均销量'] - a['近一周日均销量']);

        globalProcessedData = [];
        for (const asin in grouped) {
            let group = grouped[asin];
            group.sort((a, b) => String(a['广告日期']).localeCompare(String(b['广告日期'])));
            if (String(group[group.length - 1]['广告日期']).trim() !== maxDate) continue;

            const week2Data = group.slice(-7);
            week2Data.forEach((r, idx) => {
                if (idx === week2Data.length - 1) { 
                    const match = analyticalResults.find(res => res['父asin'] === r['父asin']);
                    if(match) {
                        let rowToPush = {...match};
                        delete rowToPush['_week2_details'];
                        globalProcessedData.push(rowToPush);
                    }
                } else {
                    globalProcessedData.push(r);
                }
            });
        }

        document.getElementById('kpi-asins').innerText = analyticalResults.length;
        document.getElementById('kpi-p0').innerText = p0Count;
        let organicRatio = totalW2Sales > 0 ? (1 - (totalW2AdSales / totalW2Sales)) * 100 : 0;
        document.getElementById('kpi-organic-ratio').innerText = organicRatio.toFixed(1) + '%';
        document.getElementById('kpi-cps').innerText = totalW2Sales > 0 ? '$' + (totalW2Spend / totalW2Sales).toFixed(2) : '$0.00';
        
        let tacos = totalW2Revenue > 0 ? (totalW2Spend / totalW2Revenue) * 100 : 0;
        document.getElementById('kpi-tacos').innerText = tacos.toFixed(1) + '%';

        let w1OrganicRatio = totalW1Sales > 0 ? (1 - (totalW1AdSales / totalW1Sales)) : 0;
        let w1Cps = totalW1Sales > 0 ? (totalW1Spend / totalW1Sales) : 0;
        let w1Tacos = totalW1Revenue > 0 ? (totalW1Spend / totalW1Revenue) : 0;
        
        let w2OrganicRatio = totalW2Sales > 0 ? (1 - (totalW2AdSales / totalW2Sales)) : 0;
        let w2Cps = totalW2Sales > 0 ? (totalW2Spend / totalW2Sales) : 0;
        let w2Tacos = totalW2Revenue > 0 ? (totalW2Spend / totalW2Revenue) : 0;
        
        let diffOrg = w2OrganicRatio - w1OrganicRatio;
        let diffCps = w2Cps - w1Cps;
        let diffTacos = w2Tacos - w1Tacos;
        
        function renderTrend(elId, diff, isCost, isPercent, baseVal) {
            const el = document.getElementById(elId);
            let icon = diff > 0 ? '↑' : (diff < 0 ? '↓' : '-');
            let colorClass = 'trend-neutral';
            
            if (diff > 0) colorClass = isCost ? 'trend-up-bad' : 'trend-up-good';
            else if (diff < 0) colorClass = isCost ? 'trend-down-good' : 'trend-down-bad';
            
            let valStr = isPercent ? (Math.abs(diff) * 100).toFixed(1) + '%' : '$' + Math.abs(diff).toFixed(2);
            if (diff === 0) valStr = '持平';
            
            let baseStr = isPercent ? (baseVal * 100).toFixed(1) + '%' : '$' + baseVal.toFixed(2);
            
            el.className = 'kpi-trend'; 
            el.innerHTML = `<span style="color:#86868b; font-weight:500; margin-right:8px;">上周基准: ${baseStr}</span><span class="${colorClass}">环比 ${icon} ${valStr}</span>`;
        }
        
        renderTrend('trend-organic', diffOrg, false, true, w1OrganicRatio);
        renderTrend('trend-cps', diffCps, true, false, w1Cps);
        renderTrend('trend-tacos', diffTacos, true, true, w1Tacos);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('kpi-grid').style.display = 'grid';
        document.getElementById('charts-grid-1').style.display = 'grid';
        document.getElementById('charts-grid-sales').style.display = 'grid';
        document.getElementById('charts-grid-cps').style.display = 'grid';
        document.getElementById('charts-grid-ctr').style.display = 'grid';
        document.getElementById('charts-grid-cvr').style.display = 'grid';
        document.getElementById('actions').style.display = 'block';

        populateOwnerFilter(analyticalResults);
        renderCharts(priorityCounts, analyticalResults);
    }

    function populateOwnerFilter(results) {
        const select = document.getElementById('ownerFilterCps');
        const select2 = document.getElementById('ownerFilterCvr');
        const select3 = document.getElementById('ownerFilterSales');
        const select4 = document.getElementById('ownerFilterCtr');
        const owners = new Set();
        results.forEach(r => {
            if (r['营销负责人']) owners.add(r['营销负责人']);
        });
        
        select.innerHTML = '<option value="ALL">全员</option>';
        select2.innerHTML = '<option value="ALL">全员</option>';
        select3.innerHTML = '<option value="ALL">全员</option>';
        select4.innerHTML = '<option value="ALL">全员</option>';
        Array.from(owners).sort().forEach(owner => {
            const opt = document.createElement('option');
            opt.value = owner;
            opt.innerText = owner;
            select.appendChild(opt);
            select2.appendChild(opt.cloneNode(true));
            select3.appendChild(opt.cloneNode(true));
            select4.appendChild(opt.cloneNode(true));
        });
    }

    function drillDown(asinOrOwner) {
        const input = document.getElementById('searchInput');
        input.value = asinOrOwner;
        renderModalTable();
    }
    window.drillDown = drillDown;
    
    function changePriorityFilter() {
        currentModalType = document.getElementById('priorityFilter').value;
        renderModalTable();
    }
    window.changePriorityFilter = changePriorityFilter;

    // 色彩分级更新：图表颜色映射
    function getPriorityColor(name) {
        if(name.includes('P0')) return '#FF3B30';
        if(name.includes('P1')) return '#FF9500';
        if(name.includes('P2')) return '#007AFF';
        if(name.includes('P3')) return '#34C759';
        if(name.includes('P4')) return '#8E8E93';
        return '#E5E5EA';
    }

    function triggerResize() {
        ['chart-priority', 'chart-owner', 'chart-sales', 'chart-cps', 'chart-ctr', 'chart-cvr'].forEach(id => {
            const inst = echarts.getInstanceByDom(document.getElementById(id));
            if (inst) inst.resize();
        });
    }

    function renderCharts(priorityCounts, results) {
        const chartPriority = echarts.init(document.getElementById('chart-priority'));
        const pieData = Object.keys(priorityCounts).map(k => ({name: k, value: priorityCounts[k]})).filter(d => d.value > 0);
        
        chartPriority.setOption({
            title: { text: '诊断分布视图', textStyle: { fontWeight: 700, fontSize: 16, color: '#111115' }, left: 'center', top: '2%' },
            tooltip: { trigger: 'item', backgroundColor: 'rgba(255,255,255,0.92)', borderColor: '#E5E5EA', textStyle: {color: '#111115'}, padding: 12, borderRadius: 12, extraCssText: 'box-shadow: 0 4px 20px rgba(0,0,0,0.08);' },
            series: [{
                type: 'pie', 
                radius: ['35%', '55%'],
                center: ['50%', '55%'],
                itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 3 }, 
                label: { show: true, formatter: '{b}\n{c} 款', lineHeight: 18, color: '#6E6E73', fontSize: 12 },
                data: pieData.map(item => ({ value: item.value, name: item.name, itemStyle: { color: getPriorityColor(item.name) } }))
            }]
        });

        chartPriority.off('click');
        chartPriority.on('click', function(params) {
            if (params.name) {
                const typeMatch = params.name.match(/P[0-4]/);
                if(typeMatch) { openModalWithSearch(typeMatch[0], ''); }
            }
        });

        const chartOwner = echarts.init(document.getElementById('chart-owner'));
        
        let ownerData = {};
        let prioritiesSet = new Set();

        results.forEach(r => {
            let owner = r['营销负责人'] || '未知';
            let prio = r['优化调整优先级'];
            prioritiesSet.add(prio);
            if (!ownerData[owner]) ownerData[owner] = {};
            if (!ownerData[owner][prio]) ownerData[owner][prio] = 0;
            ownerData[owner][prio]++;
        });

        let owners = Object.keys(ownerData);
        let sortedPriorities = Array.from(prioritiesSet).sort(); 
        
        let seriesOwnerData = sortedPriorities.map(prio => {
            return {
                name: prio,
                type: 'bar',
                stack: 'total',
                barMaxWidth: 60,
                itemStyle: { color: getPriorityColor(prio) },
                emphasis: { focus: 'series' },
                data: owners.map(o => ownerData[o][prio] || 0)
            };
        });

        chartOwner.setOption({
            title: { text: '责任人管辖健康度', textStyle: { fontWeight: 700, fontSize: 16, color: '#111115' }, left: 'center', top: '2%' },
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: 'rgba(255,255,255,0.92)', borderColor: '#E5E5EA', padding: 12, borderRadius: 12, extraCssText: 'box-shadow: 0 4px 20px rgba(0,0,0,0.08);' },
            legend: { top: 'bottom', type: 'scroll', itemWidth: 14, itemHeight: 14, textStyle: {fontSize: 11, color: '#6E6E73'} },
            grid: { left: '3%', right: '4%', bottom: '20%', top: '15%', containLabel: true },
            xAxis: { type: 'category', data: owners, axisLine: { lineStyle: { color: '#E5E5EA' } }, axisLabel: { color: '#6E6E73', fontWeight: 500 } },
            yAxis: { type: 'value', name: 'ASIN 款数', nameTextStyle: {color: '#6E6E73'}, splitLine: { lineStyle: { type: 'dashed', color: '#F2F2F7' } } },
            series: seriesOwnerData
        });

        chartOwner.off('click');
        chartOwner.on('click', function(params) { 
            if (params.name) openModalWithSearch('ALL', params.name); 
        });

        updateSalesChart();
        updateCpsChart();
        updateCtrChart();
        updateCvrChart();

        window.addEventListener('resize', triggerResize);
    }

    function updateSalesChart() {
        const ownerFilter = document.getElementById('ownerFilterSales').value;
        let filtered = analyticalResults;
        if (ownerFilter !== 'ALL') {
            filtered = analyticalResults.filter(r => (r['营销负责人'] || '未知') === ownerFilter);
        }

        const chartSales = echarts.init(document.getElementById('chart-sales'));
        let badAsins = [...filtered].filter(a => a['日均销量差额'] < 0 && a['上周日均花费'] > 0).sort((a, b) => a['日均销量差额'] - b['日均销量差额']).slice(0, 10);
        
        chartSales.setOption({
            tooltip: { 
                trigger: 'axis', backgroundColor: 'rgba(255,255,255,0.92)', borderColor: '#E5E5EA', padding: 12, borderRadius: 12, extraCssText: 'box-shadow: 0 4px 20px rgba(0,0,0,0.08);',
                formatter: function(params) {
                    const item = badAsins[params[0].dataIndex];
                    return `<b>父ASIN:</b> ${item['父asin']}<br/><b>货号:</b> ${item['货号'] || '-'}<br/><b>营销负责人:</b> ${item['营销负责人'] || '-'}<br/><br/>

    function getSubtextHtml(w1, diff, rate, isCost=false, isPercentFormat=false, isCurrency=false) {
        let prefix = isCurrency ? '$' : '';
        let absDiff = Math.abs(diff);
        let diffVal = isPercentFormat ? (absDiff * 100).toFixed(2) + '%' : absDiff.toFixed(2);
        let diffSign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
        let diffValStr = diffSign + prefix + diffVal;

        let absRate = Math.abs(rate);
        let rateVal = (absRate * 100).toFixed(1) + '%';
        let rateSign = rate > 0 ? '+' : (rate < 0 ? '-' : '');
        let rateValStr = rateSign + rateVal;

        let w1ValStr = isPercentFormat ? (w1 * 100).toFixed(2) + '%' : w1.toFixed(2);
        if(!isPercentFormat) w1ValStr = prefix + w1ValStr;
        
        let colorHex = '#86868b';
        if (diff > 0) colorHex = isCost ? 'var(--red)' : 'var(--green)';
        else if (diff < 0) colorHex = isCost ? 'var(--green)' : 'var(--red)';

        return `<div class="sub-metric">
            上周基准: ${w1ValStr} <br>
            <span style="color:${colorHex};">差额: ${diffValStr} (${rateValStr})</span>
        </div>`;
    }

    function renderModalTable() {
        const container = document.getElementById('modal-table-container');

        let filteredData = analyticalResults;

            filteredData = filteredData.filter(d => String(d['优化调整优先级']).includes(currentModalType));
        }

        if (searchVal) {
            filteredData = filteredData.filter(d => 
                (d['父asin'] && d['父asin'].toLowerCase().includes(searchVal)) ||

                let imgHtml = row['主图'] 
                    ? `<img src="${row['主图']}" onclick="openImgModal('${row['主图']}', event)" onerror="this.style.display='none'" style="width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #F2F2F7; flex-shrink:0; border: 1px solid #E5E5EA; cursor: zoom-in;" title="点击放大图片">` 
                    : `<div style="width: 44px; height: 44px; border-radius: 6px; background: #F2F2F7; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#A1A1A6; font-size:10px; border: 1px solid #E5E5EA;">暂无</div>`;

                let salesHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">${row['近一周日均销量']}</div>` + getSubtextHtml(row['上周日均销量'], row['日均销量差额'], row['销量环比'], false, false, false);
                let spendHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">$${row['近一周日均花费']}</div>` + getSubtextHtml(row['上周日均花费'], row['日均花费差额'], row['花费环比'], true, false, true);
                let adRatioHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">${(row['近一周广告占比']*100).toFixed(2)}%</div>` + getSubtextHtml(row['上周广告占比'], row['广告占比差额'], row['广告占比环比'], true, true, false);
                let cpsHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">$${row['近一周CPS']}</div>` + getSubtextHtml(row['上周CPS'], row['CPS差额'], row['CPS环比'], true, false, true);
                let tacosHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">${(row['近一周TACOS']*100).toFixed(2)}%</div>` + getSubtextHtml(row['上周TACOS'], row['TACOS差额'], row['TACOS环比'], true, true, false);
                let ctrHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">${(row['近一周CTR']*100).toFixed(2)}%</div>` + getSubtextHtml(row['上周CTR'], row['CTR差额'], row['CTR环比'], false, true, false);
                let cvrHtml = `<div style="font-weight:700;font-size:16px;color:var(--text-main);">${(row['近一周CVR']*100).toFixed(2)}%</div>` + getSubtextHtml(row['上周CVR'], row['CVR差额'], row['CVR环比'], false, true, false);

                html += `<tr style="cursor: pointer;" title="点击当前行可直接下钻查看 7 日流水" onclick="drillDown('${row['父asin']}')">
                    <td>
                        <div style="display:flex; align-items:center; gap:12px; text-align:left; justify-content:left; padding-left: 10px;">
                            ${imgHtml}
                            <div style="text-align:left;">
                                <strong style="font-size:14px;color:var(--text-main);">${row['父asin'] || '-'}</strong><br>
                                <span style="color:var(--text-muted);font-size:11px;font-weight:500;">${row['货号'] || '-'} / ${row['营销负责人'] || '-'}</span>
                            </div>
                        </div>
                    </td>
                    <td class="priority-cell">${priorityTag}</td>
                    <td>${salesHtml}</td>
                    <td>${spendHtml}</td>
                    <td>${adRatioHtml}</td>
                    <td>${cpsHtml}</td>
                    <td>${tacosHtml}</td>
                    <td>${ctrHtml}</td>
                    <td>${cvrHtml}</td>
                    <td class="wrap-cell">${conclusionHtml}</td>
                </tr>`;
            });
        }
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function getTagHtml(priority) {
        if(priority.includes('P0')) return `<span class="tag tag-p0">${priority}</span>`;
        if(priority.includes('P1')) return `<span class="tag tag-p1">${priority}</span>`;
        if(priority.includes('P2')) return `<span class="tag tag-p2">${priority}</span>`;
        if(priority.includes('P3')) return `<span class="tag tag-p3">${priority}</span>`;
        return `<span class="tag tag-p4">${priority}</span>`;
    }

    async function exportToExcelV6_6() {
        if(globalProcessedData.length === 0) return alert('没有可导出的数据');
        
        try {
            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet('全矩阵洞察报表');

            const newCols = [
                '主图',
                '上周日均销量', '近一周日均销量', '日均销量差额', '销量环比',
                '上周广告占比', '近一周广告占比', '广告占比差额', '广告占比环比',
                '上周日均花费', '近一周日均花费', '日均花费差额', '花费环比',
                '上周TACOS', '近一周TACOS', 'TACOS差额', 'TACOS环比',
                '上周CPS', '近一周CPS', 'CPS差额', 'CPS环比',
                '上周CTR', '近一周CTR', 'CTR差额', 'CTR环比',
                '上周CVR', '近一周CVR', 'CVR差额', 'CVR环比',
                '优化调整优先级', '诊断结论'
            ];
            
            const originalColsNoDups = globalOriginalColumns.filter(c => c !== 'undefined' && c !== '' && !['主图', '图片', '商品图片'].includes(c));
            const allCols = [...originalColsNoDups, ...newCols];
            
            const headerRow = ws.addRow(allCols);
            headerRow.height = 45; 
            headerRow.eachCell(cell => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1D1D1F' } };
                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
            });

            ws.views = [{ state: 'frozen', xSplit: 3, ySplit: 1 }];

            globalProcessedData.forEach((rowData, index) => {
                const rowValues = allCols.map(colName => {
                    if (colName === '诊断结论') return rowData['导出诊断结论'] || '';
                    return rowData[colName] !== undefined ? rowData[colName] : '';
                });
                
                const row = ws.addRow(rowValues);
                const isEven = (index + 2) % 2 === 0;
                
                row.eachCell((cell, colNumber) => {
                    const colName = allCols[colNumber - 1];
                    cell.border = { bottom: {style:'thin', color:{argb:'FFE5E5EA'}} };
                    
                    let baseFill = isEven ? 'FFF9FAFB' : 'FFFFFFFF';
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: baseFill } };
                    
                    if (colName.includes('结论')) {
                        cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
                    } else {
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    }

                    const isPercentage = colName.includes('占比') || colName.includes('ACOS') || colName.includes('TACOS') || colName.includes('CTR') || colName.includes('CVR') || colName.includes('环比');
                    
                    if (isPercentage && typeof cell.value === 'number') {
                        cell.numFmt = '0.00%';
                        if (colName.includes('差额') || colName.includes('环比')) {
                            if (colName.includes('销量')) {
                                if (cell.value > 0.01) applyStyle(cell, 'FFE6F4EA', 'FF137333');
                                else if (cell.value < -0.01) applyStyle(cell, 'FFFCE8E6', 'FFC5221F');
                            } else {
                                if (cell.value < -0.01) applyStyle(cell, 'FFE6F4EA', 'FF137333');
                                else if (cell.value > 0.01) applyStyle(cell, 'FFFCE8E6', 'FFC5221F');
                            }
                        }
                    }
                    else if ((colName.includes('花费差额') || colName.includes('CPS差额')) && typeof cell.value === 'number') {
                        cell.numFmt = '0.00';
                        if (cell.value < -0.1) applyStyle(cell, 'FFE6F4EA', 'FF137333');
                        else if (cell.value > 0.1) applyStyle(cell, 'FFFCE8E6', 'FFC5221F');
                    }
                    else if (colName.includes('销量差额') && typeof cell.value === 'number') {
                        cell.numFmt = '0.00';
                        if (cell.value > 0.5) applyStyle(cell, 'FFE6F4EA', 'FF137333');
                        else if (cell.value < -0.5) applyStyle(cell, 'FFFCE8E6', 'FFC5221F');
                    }
                    // 色彩分级更新：Excel 导出底色匹配
                    else if (colName === '优化调整优先级' && cell.value) {
                        const valStr = String(cell.value);
                        if (valStr.includes('P0')) {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFECEB' } };
                            cell.font = { color: { argb: 'FFFF3B30' }, bold: true };
                        } else if (valStr.includes('P1')) {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF4E5' } };
                            cell.font = { color: { argb: 'FFFF9500' }, bold: true };
                        } else if (valStr.includes('P2')) {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5F1FF' } };
                            cell.font = { color: { argb: 'FF007AFF' }, bold: true };
                        } else if (valStr.includes('P3')) {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEBF9EE' } };
                            cell.font = { color: { argb: 'FF34C759' }, bold: true };
                        } else if (valStr.includes('P4')) {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F7' } };
                            cell.font = { color: { argb: 'FF8E8E93' }, bold: true };
                        }
                    }
                });
            });

            ws.autoFilter = {
                from: { row: 1, column: 1 },
                to: { row: globalProcessedData.length + 1, column: allCols.length }
            };

            ws.columns.forEach((col, i) => {
                let colName = allCols[i];
                if (colName.includes('结论')) col.width = 45; 
                else if (colName.includes('主图')) col.width = 25; 
                else if (colName.includes('优先级')) col.width = 16;
                else if (colName.includes('asin') || colName.includes('货号') || colName.includes('日期')) col.width = 14; 
                else col.width = 13; 
            });

            function applyStyle(cell, bgColor, fontColor) {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
                cell.font = { color: { argb: fontColor }, bold: true };
            }

            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            saveAs(blob, "广告数据报表_全矩阵深度分析_V6.6.xlsx");

        } catch (error) {
            alert("导出异常: " + error.message);
        }
    }

    // --- 全局版块级点击穿透 ---
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.kpi-card').forEach(el => {
            el.addEventListener('click', function(e) {
                let type = 'ALL';
                if (this.querySelector('.kpi-label') && this.querySelector('.kpi-label').innerText.includes('P0')) {
                    type = 'P0';
                }
                openModalWithSearch(type, '');
            });
        });

        document.querySelectorAll('.chart-container').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION' || e.target.tagName === 'CANVAS') return;
                openModalWithSearch('ALL', '');
            });
        });
        
        autoFetchCloudData();
    });

    async function autoFetchCloudData() {
        const loadingEl = document.getElementById('loading');
        const uploadArea = document.querySelector('.upload-area');
        
        try {
            loadingEl.innerText = '正在尝试拉取云端库最新数据...';
            loadingEl.style.display = 'block';
            uploadArea.style.display = 'none';

            const timestamp = new Date().getTime();
            const response = await fetch(`./广告数据.xlsx?t=${timestamp}`, { cache: 'no-store' });
            
            if (!response.ok) {
                throw new Error(`云端文件未找到或网络异常 (HTTP ${response.status})`);
            }

            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});
            
            if(jsonData.length > 0) {
                globalOriginalColumns = Object.keys(jsonData[0]);
                processData(jsonData);
            } else {
                throw new Error("云端表格为空");
            }
            
        } catch (err) {
            console.warn('云端自动拉取中止，转为手动模式：', err);
            loadingEl.style.display = 'none';
            uploadArea.style.display = 'block';
            uploadArea.querySelector('h3').innerText = '未检测到云端更新，请手动导入《广告数据报表》';
        }
    }
</script>
